<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>财务规划 · Money Manage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    :root {
      --ink: #17212b;
      --coral: #f07f62;
      --coral-deep: #d9654a;
      --paper: #f6f8f5;
      --mint: #d8f3e4;
      --w: 390px;
      --h: 844px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #c8cdc6;
      color: var(--ink);
      font-family: "Sora", "Noto Serif SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100%;
      min-height: 100dvh;
      padding: 0;
    }

    /* Stage = Moments poster frame; fills viewport at capture size */
    .stage {
      position: relative;
      width: min(100vw, var(--w));
      height: min(100dvh, var(--h));
      aspect-ratio: 390 / 844;
      max-width: var(--w);
      max-height: var(--h);
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(130% 72% at 92% -10%, rgba(216, 243, 228, 0.98) 0%, transparent 56%),
        radial-gradient(85% 50% at -14% 78%, rgba(240, 127, 98, 0.16) 0%, transparent 52%),
        radial-gradient(60% 40% at 50% 100%, rgba(216, 243, 228, 0.35) 0%, transparent 60%),
        linear-gradient(168deg, #fbfcfa 0%, var(--paper) 38%, #e8efe9 100%);
    }

    /* Desktop-only soft edge so preview still reads as a frame */
    @media (min-width: 421px) and (min-height: 860px) {
      body { padding: 20px; }
      .stage {
        box-shadow: 0 22px 48px rgba(23, 33, 43, 0.16);
      }
    }

    /* Soft paper grain */
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.32;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.09 0 0 0 0 0.13 0 0 0 0 0.17 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }

    /* Ambient coral wash — atmosphere, not a card */
    .stage::after {
      content: "";
      position: absolute;
      left: -20%;
      right: -20%;
      bottom: 18%;
      height: 42%;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 80%, rgba(240, 127, 98, 0.09) 0%, transparent 70%);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 48px 28px 36px;
    }

    .brand-block {
      flex: 0 0 auto;
    }

    .brand-en {
      font-family: "Sora", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(23, 33, 43, 0.42);
      margin-bottom: 10px;
    }

    .brand-zh {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 56px;
      line-height: 1.02;
      letter-spacing: 0.08em;
      color: var(--ink);
    }

    .brand-zh .mark {
      display: inline-block;
      width: 9px;
      height: 9px;
      margin: 0 2px 11px 4px;
      background: var(--coral);
      vertical-align: middle;
      transform: rotate(12deg);
    }

    .headline {
      margin-top: 20px;
      font-family: "Noto Serif SC", serif;
      font-weight: 600;
      font-size: 22px;
      line-height: 1.4;
      letter-spacing: 0.03em;
      max-width: 12.5em;
      color: var(--ink);
    }

    .support {
      margin-top: 10px;
      font-family: "Sora", sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.01em;
      color: rgba(23, 33, 43, 0.62);
      max-width: 22em;
    }

    /* Feature narrative — promo rhythm, not catalog columns */
    .features {
      flex: 0 0 auto;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid rgba(23, 33, 43, 0.1);
    }

    .features-kicker {
      font-family: "Sora", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--coral-deep);
      margin-bottom: 12px;
    }

    .feature-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .feature-list li {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 10px;
      align-items: baseline;
    }

    .feature-num {
      font-family: "Sora", sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--coral);
      line-height: 1.45;
    }

    .feature-line {
      position: relative;
      padding-left: 12px;
      font-family: "Noto Serif SC", serif;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.04em;
      line-height: 1.45;
      color: var(--ink);
    }

    .feature-line::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.28em;
      bottom: 0.28em;
      width: 2px;
      background: var(--coral);
      opacity: 0.85;
    }

    .feature-line span {
      font-family: "Sora", sans-serif;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.01em;
      color: rgba(23, 33, 43, 0.5);
      margin-left: 0.35em;
    }

    .visual {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
      margin: 10px 0 4px;
    }

    .chart-label {
      font-family: "Sora", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(23, 33, 43, 0.45);
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .chart-label em {
      font-style: normal;
      color: var(--coral-deep);
      font-weight: 600;
    }

    .chart {
      width: 100%;
      height: auto;
      max-height: 188px;
      overflow: visible;
    }

    .chart .grid-line {
      stroke: rgba(23, 33, 43, 0.07);
      stroke-width: 1;
    }

    .chart .area {
      fill: url(#areaFill);
    }

    .chart .curve {
      fill: none;
      stroke: var(--coral);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart .curve-deep {
      fill: none;
      stroke: var(--coral-deep);
      stroke-width: 1.2;
      stroke-opacity: 0.32;
      stroke-linecap: round;
      stroke-dasharray: 3 7;
    }

    .chart .axis-label {
      font-family: "Sora", sans-serif;
      font-size: 10px;
      fill: rgba(23, 33, 43, 0.36);
    }

    .chart .anno {
      font-family: "Sora", sans-serif;
      font-size: 10px;
      font-weight: 500;
      fill: var(--coral-deep);
      letter-spacing: 0.04em;
    }

    .chart .anno-dot {
      fill: var(--coral);
    }

    .cta {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: auto;
      padding: 14px 14px 14px 12px;
      background: rgba(23, 33, 43, 0.04);
      border: 1px solid rgba(23, 33, 43, 0.08);
      border-left: 3px solid var(--coral);
    }

    .qr-wrap {
      flex: 0 0 auto;
      width: 104px;
      height: 104px;
      padding: 7px;
      background: #fff;
      border: 1px solid rgba(23, 33, 43, 0.14);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
    }

    .qr-wrap canvas,
    .qr-wrap img {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .cta-copy {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .cta-title {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: 0.05em;
      color: var(--ink);
    }

    .cta-hint {
      font-family: "Sora", sans-serif;
      font-size: 12px;
      line-height: 1.45;
      color: rgba(23, 33, 43, 0.58);
    }

    .cta-bar {
      width: 40px;
      height: 3px;
      margin-top: 5px;
      background: linear-gradient(90deg, var(--coral), var(--coral-deep));
    }

    /* —— Motions —— */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 0.55; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .anim-brand { animation: riseIn 0.55s ease-out both; }
    .anim-copy { animation: riseIn 0.55s ease-out 0.1s both; }
    .anim-features { animation: riseIn 0.5s ease-out 0.2s both; }
    .anim-visual { animation: fadeIn 0.45s ease-out 0.28s both; }
    .anim-cta { animation: fadeIn 0.5s ease-out 0.55s both; }

    .anim-curve {
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: drawStroke 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }

    .anim-area {
      opacity: 0;
      animation: fadeIn 0.7s ease-out 0.75s forwards;
    }

    .anim-anno {
      opacity: 0;
      animation: fadeIn 0.5s ease-out 0.95s forwards;
      transform-origin: center;
    }

    .anim-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseDot 1.8s ease-in-out 1.1s 2 both;
    }

    html.static .anim-brand,
    html.static .anim-copy,
    html.static .anim-features,
    html.static .anim-visual,
    html.static .anim-cta,
    html.static .anim-curve,
    html.static .anim-area,
    html.static .anim-anno,
    html.static .anim-dot {
      animation: none !important;
      opacity: 1;
      transform: none;
      stroke-dashoffset: 0;
    }

    /* Phone / capture: stage paints the whole viewport — no gray margin */
    @media (max-width: 420px), (max-height: 860px) {
      body { background: var(--paper); }
      .stage {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        max-width: none;
        max-height: none;
        aspect-ratio: auto;
        box-shadow: none;
      }
    }

    /* Discreet dbg entry — low contrast corner tap target */
    .dbg-entry {
      position: absolute;
      right: 10px;
      bottom: 8px;
      z-index: 2;
      font-family: "Sora", sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: rgba(23, 33, 43, 0.18);
      text-decoration: none;
      padding: 6px 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .dbg-entry:hover,
    .dbg-entry:focus-visible {
      color: rgba(23, 33, 43, 0.45);
    }
  </style>
</head>
<body>
  <div class="stage" role="img" aria-label="财务规划宣传图">
    <div class="content">
      <header class="brand-block anim-brand">
        <p class="brand-en">Money Manage</p>
        <h1 class="brand-zh">财务<span class="mark" aria-hidden="true"></span>规划</h1>
      </header>

      <div class="anim-copy">
        <h2 class="headline">一眼看清，花得起还是花不起</h2>
        <p class="support">工资、资产、支出联动——即时结余，再看到三十年后。</p>
      </div>

      <div class="features anim-features" aria-label="能算什么">
        <p class="features-kicker">能算什么</p>
        <ol class="feature-list">
          <li>
            <span class="feature-num" aria-hidden="true">01</span>
            <p class="feature-line">即时结余 <span>工资 · 资产 · 支出联动</span></p>
          </li>
          <li>
            <span class="feature-num" aria-hidden="true">02</span>
            <p class="feature-line">三十年走势 <span>现金 · 理财 · 备用金</span></p>
          </li>
          <li>
            <span class="feature-num" aria-hidden="true">03</span>
            <p class="feature-line">消费影响 <span>一笔支出，看长期余波</span></p>
          </li>
        </ol>
      </div>

      <div class="visual anim-visual" aria-hidden="true">
        <p class="chart-label">示意 · <em>结余后的资产</em></p>
        <svg class="chart" viewBox="0 0 334 188" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f07f62" stop-opacity="0.3" />
              <stop offset="55%" stop-color="#f07f62" stop-opacity="0.08" />
              <stop offset="100%" stop-color="#f07f62" stop-opacity="0" />
            </linearGradient>
          </defs>

          <line class="grid-line" x1="8" y1="36" x2="326" y2="36" />
          <line class="grid-line" x1="8" y1="80" x2="326" y2="80" />
          <line class="grid-line" x1="8" y1="124" x2="326" y2="124" />

          <path class="curve-deep"
            d="M12,144 C48,138 72,134 98,126 C132,114 148,104 178,94 C210,82 230,78 258,66 C286,54 306,44 322,32" />

          <path class="area anim-area"
            d="M12,152 C52,146 78,132 108,118 C142,100 164,86 198,72 C232,58 258,42 322,24 L322,168 L12,168 Z" />

          <path class="curve anim-curve"
            d="M12,152 C52,146 78,132 108,118 C142,100 164,86 198,72 C232,58 258,42 322,24" />

          <g class="anim-anno">
            <circle class="anno-dot anim-dot" cx="322" cy="24" r="4.5" />
            <text class="anno" x="318" y="14" text-anchor="end">资产抬升</text>
          </g>

          <text class="axis-label" x="12" y="182">今</text>
          <text class="axis-label" x="158" y="182">15 年</text>
          <text class="axis-label" x="300" y="182">30 年</text>
        </svg>
      </div>

      <footer class="cta anim-cta">
        <div class="qr-wrap" id="qr" title="扫描体验 Money Manage"></div>
        <div class="cta-copy">
          <p class="cta-title">扫码免费体验</p>
          <p class="cta-hint">打开即可规划结余与长期走势</p>
          <div class="cta-bar" aria-hidden="true"></div>
        </div>
      </footer>
    </div>
    <a class="dbg-entry" href="/?debug=true" title="debug">dbg</a>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("static") === "1") {
        document.documentElement.classList.add("static");
      }

      var url = "https://money-manage.wangjser.workers.dev/";
      var el = document.getElementById("qr");

      function paintFallback() {
        var img = document.createElement("img");
        img.alt = "二维码";
        img.width = 90;
        img.height = 90;
        img.src = "https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data=" + encodeURIComponent(url);
        el.appendChild(img);
      }

      if (typeof QRCode === "undefined") {
        paintFallback();
        return;
      }

      QRCode.toCanvas(
        url,
        {
          width: 180,
          margin: 1,
          color: { dark: "#17212b", light: "#ffffff" },
          errorCorrectionLevel: "M"
        },
        function (err, canvas) {
          if (err || !canvas) {
            paintFallback();
            return;
          }
          canvas.style.width = "90px";
          canvas.style.height = "90px";
          el.appendChild(canvas);
        }
      );
    })();
  </script>
</body>
</html>
