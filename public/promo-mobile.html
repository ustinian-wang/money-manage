<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>财务规划 · Money Manage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
  <style>
    :root {
      --ink: #17212b;
      --coral: #f07f62;
      --coral-deep: #d9654a;
      --paper: #f6f8f5;
      --mint: #d8f3e4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Sora", "Noto Serif SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* 默认：移动端 / 窄屏 = 真·满屏海报，无灰边 */
    .viewport {
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      display: grid;
      place-items: stretch;
    }

    .stage {
      position: relative;
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(120% 70% at 100% 0%, rgba(216, 243, 228, 0.95) 0%, transparent 55%),
        radial-gradient(90% 50% at 0% 85%, rgba(240, 127, 98, 0.14) 0%, transparent 50%),
        linear-gradient(168deg, #fbfcfa 0%, var(--paper) 45%, #eef3ee 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.26;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.09 0 0 0 0 0.13 0 0 0 0 0.17 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(28px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }

    .brand-zh {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: clamp(40px, 11vw, 52px);
      line-height: 1.05;
      letter-spacing: 0.08em;
    }

    .brand-rule {
      width: 32px;
      height: 3px;
      margin-top: 10px;
      background: var(--coral);
    }

    .headline {
      margin-top: 14px;
      font-family: "Noto Serif SC", serif;
      font-weight: 600;
      font-size: clamp(18px, 4.8vw, 22px);
      line-height: 1.35;
      letter-spacing: 0.02em;
    }

    /* 三项功能：一行叙事，去掉编号与重复说明 */
    .features {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(23, 33, 43, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 8px 0;
      font-family: "Sora", sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(23, 33, 43, 0.72);
    }

    .features span {
      display: inline-flex;
      align-items: center;
    }

    .features span + span::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 3px;
      margin: 0 10px;
      border-radius: 50%;
      background: var(--coral);
    }

    .visual {
      flex: 1 1 auto;
      min-height: 160px;
      margin: 16px 0 14px;
      display: flex;
      flex-direction: column;
    }

    .chart {
      flex: 1 1 auto;
      width: 100%;
      min-height: 160px;
      display: block;
    }

    .chart .grid-line {
      stroke: rgba(23, 33, 43, 0.07);
      stroke-width: 1;
    }

    .chart .area { fill: url(#areaFill); }

    .chart .curve {
      fill: none;
      stroke: var(--coral);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart .axis-label {
      font-family: "Sora", sans-serif;
      font-size: 11px;
      fill: rgba(23, 33, 43, 0.38);
    }

    .cta {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: #fff;
      border: 1px solid rgba(23, 33, 43, 0.1);
      border-left: 3px solid var(--coral);
    }

    .qr-wrap {
      flex: 0 0 auto;
      width: 88px;
      height: 88px;
      padding: 5px;
      background: #fff;
      border: 1px solid rgba(23, 33, 43, 0.12);
    }

    .qr-wrap canvas,
    .qr-wrap img {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .cta-title {
      font-family: "Noto Serif SC", serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .cta-hint {
      margin-top: 4px;
      font-family: "Sora", sans-serif;
      font-size: 12px;
      color: rgba(23, 33, 43, 0.55);
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes drawStroke {
      to { stroke-dashoffset: 0; }
    }

    .anim-brand { animation: riseIn 0.45s ease-out both; }
    .anim-features { animation: riseIn 0.4s ease-out 0.08s both; }
    .anim-visual { animation: fadeIn 0.4s ease-out 0.16s both; }
    .anim-cta { animation: fadeIn 0.4s ease-out 0.28s both; }

    .anim-curve {
      stroke-dasharray: 480;
      stroke-dashoffset: 480;
      animation: drawStroke 0.95s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards;
    }

    .anim-area {
      opacity: 0;
      animation: fadeIn 0.55s ease-out 0.65s forwards;
    }

    html.static .anim-brand,
    html.static .anim-features,
    html.static .anim-visual,
    html.static .anim-cta,
    html.static .anim-curve,
    html.static .anim-area {
      animation: none !important;
      opacity: 1;
      transform: none;
      stroke-dashoffset: 0;
    }

    /*
      宽屏桌面预览：居中 390×844 卡片（方便截朋友圈）
      移动端保持上面的满屏规则
    */
    @media (min-width: 480px) {
      body { background: #c8cdc6; }
      .viewport {
        place-items: center;
        padding: 20px;
        min-height: 100dvh;
      }
      .stage {
        width: 390px;
        height: 844px;
        min-height: 0;
        box-shadow: 0 22px 48px rgba(23, 33, 43, 0.16);
      }
      .content {
        min-height: 0;
        height: 100%;
        padding: 40px 26px 28px;
      }
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="stage" role="img" aria-label="财务规划宣传图">
      <div class="content">
        <header class="anim-brand">
          <h1 class="brand-zh">财务规划</h1>
          <div class="brand-rule" aria-hidden="true"></div>
          <h2 class="headline">一眼看清，花得起还是花不起</h2>
        </header>

        <p class="features anim-features">
          <span>即时结余</span>
          <span>三十年走势</span>
          <span>消费影响</span>
        </p>

        <div class="visual anim-visual" aria-hidden="true">
          <svg class="chart" viewBox="0 0 334 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f07f62" stop-opacity="0.28" />
                <stop offset="75%" stop-color="#f07f62" stop-opacity="0.05" />
                <stop offset="100%" stop-color="#f07f62" stop-opacity="0" />
              </linearGradient>
            </defs>
            <line class="grid-line" x1="0" y1="36" x2="334" y2="36" />
            <line class="grid-line" x1="0" y1="72" x2="334" y2="72" />
            <line class="grid-line" x1="0" y1="108" x2="334" y2="108" />
            <path class="area anim-area"
              d="M4,128 C48,120 76,108 110,92 C148,74 176,60 214,46 C252,32 286,22 330,14 L330,148 L4,148 Z" />
            <path class="curve anim-curve"
              d="M4,128 C48,120 76,108 110,92 C148,74 176,60 214,46 C252,32 286,22 330,14" />
            <text class="axis-label" x="4" y="156">今</text>
            <text class="axis-label" x="152" y="156">15 年</text>
            <text class="axis-label" x="300" y="156">30 年</text>
          </svg>
        </div>

        <footer class="cta anim-cta">
          <div class="qr-wrap" id="qr" title="扫描体验"></div>
          <div>
            <p class="cta-title">扫码免费体验</p>
            <p class="cta-hint">调工资与支出，看结余与走势</p>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      if (params.get("static") === "1") {
        document.documentElement.classList.add("static");
      }

      var url = "https://money-manage.wangjser.workers.dev/";
      var el = document.getElementById("qr");

      function paintFallback() {
        var img = document.createElement("img");
        img.alt = "二维码";
        img.src = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=" + encodeURIComponent(url);
        el.appendChild(img);
      }

      if (typeof QRCode === "undefined") {
        paintFallback();
        return;
      }

      QRCode.toCanvas(
        url,
        {
          width: 156,
          margin: 1,
          color: { dark: "#17212b", light: "#ffffff" },
          errorCorrectionLevel: "M"
        },
        function (err, canvas) {
          if (err || !canvas) {
            paintFallback();
            return;
          }
          canvas.style.width = "78px";
          canvas.style.height = "78px";
          el.appendChild(canvas);
        }
      );
    })();
  </script>
</body>
</html>
