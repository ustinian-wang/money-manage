# Playwright e2e: not in this workflow yet (see README「E2E 冒烟」); add as separate/optional job later.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # tests use --experimental-strip-types (Node >=22.6); Node 20 exits 9 on bad option
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Check (typecheck + test + build)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run check

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Deploy to Cloudflare Workers
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
